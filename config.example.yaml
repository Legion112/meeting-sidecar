 audio:
  # Empty = default Pulse sink + ".monitor" (playback only; never a microphone).
  monitor: ""
  sample_rate: 16000

stt:
  provider: whisper
  # Empty = ~/.local/share/meeting-sidecar/models/ggml-small.bin
  model_path: ""
  language: auto

detect:
  provider: ollama
  ollama:
    base_url: http://127.0.0.1:11434
    model: qwen2.5:0.5b

llm:
  provider: openai # answers only; openai | ollama
  openai:
    model: gpt-5.6-luna
  ollama:
    base_url: http://127.0.0.1:11434
    model: llama3.2

ui:
  display: 1
  always_on_top: true

assistant:
  language: auto
  # Omit to use the baked-in default system prompt.
  # system_prompt: |
  #   ...
