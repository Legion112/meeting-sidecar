audio:
  # Empty = default sink + ".monitor" (playback only by default).
  # all = every playback sink monitor, mixed; rescans for new headphones.
  monitor: ""
  # Initial state of the HUD "Capture microphone" checkbox (mixes default Pulse input with playback).
  microphone: false
  # Empty = default Pulse input source; or an explicit source id (not .monitor).
  microphone_source: ""
  sample_rate: 16000
  # Optional VAD overrides (omit to keep defaults: threshold 500, hangover 300 ms, min 100 ms, max 15 s).
  # vad:
  #   energy_threshold: 300
  #   hangover_ms: 500
  #   min_speech_ms: 250
  #   max_speech_sec: 30

stt:
  provider: whisper
  # Shorthand (small, large-v3-turbo, …) or absolute path. Takes precedence over model_path.
  # Searches ~/.local/share/meeting-sidecar/models/ then ~/github/transcription/models/.
  model: ""
  # Legacy explicit path; used when model is empty.
  model_path: ""
  language: auto
  initial_prompt: ""
  threads: 4

  # Russian meeting preset (recommended for live Russian calls):
  # model: large-v3-turbo
  # language: ru
  # audio:
  #   vad:
  #     hangover_ms: 500
  #     max_speech_sec: 30

detect:
  provider: ollama
  ollama:
    base_url: http://127.0.0.1:11434
    model: qwen2.5:0.5b

llm:
  provider: openai # answers only; openai | ollama
  openai:
    model: gpt-5.6-luna
  ollama:
    base_url: http://127.0.0.1:11434
    model: llama3.2

ui:
  display: 1
  always_on_top: true

assistant:
  language: auto
  # When stt.language is auto, assistant.language is used for Whisper (e.g. ru).
  # Omit to use the baked-in default system prompt.
  # system_prompt: |
  #   ...
